name: ✅

# Unfiltered on purpose: build.yml only triggers for PRs based on master, so
# stacked PRs targeting another branch get no checks at all. These are cheap
# enough to run on every layer.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.x
      - run: deno check src/*.ts
      - run: deno test --permit-no-files
